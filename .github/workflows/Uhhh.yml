name: Build HeyMod (self-contained)

# Phone-friendly: put ONLY this file in your repo at
#   .github/workflows/build.yml
# then Actions → Run workflow. It writes every source file and builds the .qmod.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

env:
  module_id: heymod
  qmod_name: HeyMod

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write all project files
        run: |
          echo "" | base64 -d > /tmp/gen_project.py
          python3 /tmp/gen_project.py
          ls -la
          find . -type f | head -40

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup QPM + NDK
        uses: Fernthedev/qpm-action@v1
        with:
          workflow_token: ${{ secrets.GITHUB_TOKEN }}
          restore: true
          cache: true
          resolve_ndk: true
          publish: false

      - name: Build & package qmod
        run: qpm s qmod

      - name: Upload .qmod
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.qmod_name }}.qmod
          path: ./${{ env.qmod_name }}.qmod
          if-no-files-found: error

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: lib${{ env.module_id }}.so
          path: |
            ./build/lib${{ env.module_id }}.so
            ./build/debug/lib${{ env.module_id }}.so
          if-no-files-found: warn
